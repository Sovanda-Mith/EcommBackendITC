type Student {
  id: ID!
  name: String!
  idCard: String!
  className: String!
  attendances: [Attendance!]!
}

type Query {
  students: [Student]
  student(className: String!): Student
}

type Mutation {
  enrollStudent(name: String!, idCard: String!, className: String!): Student
  updateStudent(
    id: ID!
    name: String
    idCard: String
    className: String
  ): Student
  removeStudent(id: ID!): Boolean
}
